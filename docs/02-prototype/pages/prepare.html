<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>素材准备 · 字幕原型</title><link rel="stylesheet" href="proto.css"></head>
<body data-page="prepare"><div id="chrome"></div><div class="shell"><aside id="sidebar"></aside><main>
<div class="page-head"><div><h1>素材准备</h1><p class="sub">检查同一集素材及处理目标，再发起任务。未上传可选资料不一律阻断。</p></div><a class="button" href="index.html">返回任务</a></div>
<div class="banner">原型使用示例素材名称；处理结果为构造字幕，不是真实转写。选择文件仅读取名称；真实音轨提取、识别、对齐均未执行。</div>
<form id="materialForm"><section class="block"><h2 class="block-title"><span class="block-code">A</span>任务与处理目标 · F-01 / F-02</h2><div class="grid3"><label>任务名称<input id="name" maxlength="70" required></label><label>源语言<select id="language"><option>普通话（演示）</option></select></label><label>处理目标<select id="mode"><option value="generate">生成新源字幕</option><option value="align">对齐已有字幕</option><option value="check">核对已有字幕</option><option value="compare">保留原稿，另识别比较</option></select></label></div><p class="hint">已有字幕时可核对、对齐或另生成，不强制从零转写。具体能力后续选型验证。</p></section>
<section class="block"><h2 class="block-title"><span class="block-code">B</span>素材包 · F-01</h2><div class="grid2"><label>视频文件名<input id="videoName" required maxlength="120"></label><label>选择本地视频（只记名称）<input type="file" id="videoFile" accept="video/*"></label><label>独立音轨名称（可空）<input id="audioName" maxlength="120"></label><label>已有字幕名称（可空）<input id="subtitleName" maxlength="120"></label><label>脚本 / 角色资料名称（可空）<input id="scriptName" maxlength="120"></label><label>声音来源<select id="audioSource"><option value="embedded">视频内音轨（提取为派生音轨）</option><option value="external">独立音轨</option></select></label></div><div class="row" style="margin-top:16px"><label><input type="checkbox" id="hasSound"> 所选来源有可用声音（演示条件）</label><label><input type="checkbox" id="matching"> 已确认素材属于同集同版本、时间对应（演示条件）</label></div><p class="hint">这些勾选是测试条件，不是机器实测；没有独立音轨但视频有声音可以继续，脚本不能直接替代实际对白。</p></section>
<section class="block"><h2 class="block-title"><span class="block-code">C</span>检查、异常与发起</h2><div class="row"><button type="button" id="checkMaterials">保存并检查素材</button><button type="button" id="startTask" class="primary">开始模拟处理 →</button></div><div id="materialResult" role="status" aria-live="polite"></div><p class="hint">修改已使用的素材将形成新输入版本。旧字幕和人工稿仍保留，需显式确认是否适用于新素材，不自动沿用。</p></section></form>
</main></div><div id="dialogHost"></div><script src="state.js"></script><script src="proto.js"></script></body></html>
